# Cấu hình mẫu DACN EDR (PH10-T02). KHÔNG chứa bí mật: token nằm ở tệp riêng do `python -m api.auth` tạo.
# Sao chép thành edr.yaml rồi chỉnh. Khóa không hỗ trợ sẽ bị từ chối khi nạp.
home: C:\dacn_edr            # thư mục dữ liệu: bronze\, silver\, logs\, run\, ioc\, agent\ (đường dẫn ngắn, tránh dấu cách)
api:
  host: 127.0.0.1             # chỉ loopback được chấp nhận
  port: 8765
  tokens_file: C:\dacn_edr\api_tokens.json   # băm sha256 của token; tạo bằng: python -m api.auth --config edr.yaml --role analyst --actor <tên>
# Chế độ response (dry_run/execute) KHÔNG cấu hình ở đây: xem config\response-policy.yaml
# Kênh Event Log agent đọc ở chế độ --live (mỗi kênh một reader, checkpoint và segment riêng). Thiếu mục này = chỉ Sysmon.
# Kênh Defender/PowerShell mặc định TẮT (D10, docs/architecture/w8/telemetry-defender-powershell-proposal.md): chỉ bật sau khi
# đo trên VM. PowerShell 4104 cần bật Script Block Logging (mục 2.4 của tài liệu trên) và có thể chứa dữ liệu nhạy cảm (mục 2.7).
# Silver cho hai kênh mới có từ 2026-11-28 (DDL v1.3 đề xuất); rule Defender DACN-DET-201/202 có; rule PowerShell 4104 và
# che bí mật ở API CHƯA triển khai.
# xpath (tùy chọn) ghi đè bộ lọc mặc định trong poc/sysmon-collector/windows_channels.py (DEFAULT_XPATH).
agent:
  channels:
    - {name: "Microsoft-Windows-Sysmon/Operational", enabled: true}
    - {name: "Microsoft-Windows-Windows Defender/Operational", enabled: false}
    - {name: "Microsoft-Windows-PowerShell/Operational", enabled: false}
# Ngưỡng segment của agent hiện đặt trong mã (BronzeWriter: 5000 bản ghi / 8 MiB / 300 s); chưa có khóa cấu hình.
