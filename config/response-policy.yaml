# Chính sách Response (PH7-T01). MẶC ĐỊNH AN TOÀN: dry_run. Đổi sang execute là quyết định của người dùng, chỉ trên VM lab.
mode: dry_run              # dry_run | execute
execute_unlocked: false    # khóa thứ hai: execute chỉ hoạt động khi cả mode=execute VÀ execute_unlocked=true
require_distinct_approver: false   # true = người duyệt phải khác người yêu cầu
allowed_actions: [TERMINATE_PROCESS, QUARANTINE_FILE, RESTORE_FILE]
lab_marker_prefix: DACN_LAB_
lab_dirs:                  # mục tiêu thật CHỈ được nằm trong các thư mục này (hoặc mang marker lab)
  - '%TEMP%\dacn_lab'
  - '%PUBLIC%\dacn_lab'
quarantine_dir: '%TEMP%\dacn_lab\quarantine'
protected_process_names:   # không bao giờ được kết thúc
  - system
  - smss.exe
  - csrss.exe
  - wininit.exe
  - services.exe
  - lsass.exe
  - winlogon.exe
  - explorer.exe
  - svchost.exe
  - sysmon.exe
  - sysmon64.exe
  - msmpeng.exe
  - python.exe
  - pythonw.exe
protected_dirs:
  - '%SystemRoot%'
  - '%ProgramFiles%'
  - '%ProgramFiles(x86)%'
auto_response:             # PH7-T08: mặc định TẮT
  enabled: false
  rules: []
  allowed_actions: []
