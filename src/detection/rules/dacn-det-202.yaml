rule_id: DACN-DET-202
rule_version: 1
name: Microsoft Defender bị tắt bảo vệ thời gian thực, đổi cấu hình hoặc chặn thay đổi (tamper)
description: >
  Mục đích: đánh dấu sự kiện trạng thái của Defender có thể liên quan tới vô hiệu hóa công cụ bảo vệ.
  Telemetry: kênh Microsoft-Windows-Windows Defender/Operational, Event 5001 (real-time protection disabled),
  5007 (configuration changed), 5013 (tamper protection blocked a change) theo tài liệu Microsoft
  (docs/architecture/w8 mục 3.4). Bảng silver_defender_events (DDL v1.3 đề xuất).
  Severity theo Event ID: 5001 high, 5013 medium, 5007 low (người dùng duyệt D6 thay cho Cyber).
type: single
status: enabled
detection_source: EXTERNAL_DEFENDER
severity: low
severity_reason: trạng thái Defender đơn lẻ; không chứng minh có kẻ tấn công can thiệp
severity_by:
  field: windows_event_id
  map: {"5001": high, "5013": medium, "5007": low}
source_events:
  - {channel: "Microsoft-Windows-Windows Defender/Operational", event_ids: [5001, 5007, 5013]}
context_fields: [event_type, old_value, new_value]
mitre_technique_ids: [T1562.001]
mitre_basis: >
  docs/research/cyber/w5/01-detection-required-fields-and-mitre-to-data.md (T1562.001 Disable or Modify Tools gắn với DET-007);
  5001/5013 là trạng thái vô hiệu hóa hoặc bị chặn thay đổi của công cụ bảo vệ theo mô tả Microsoft
false_positives:
  - 5007 rất ồn - cả 4 mẫu thật trên VM (2026-11-28) là thay đổi nội bộ của Defender (WdConfigHash, ServiceStartStates, InitializingComponentProgress)
  - Quản trị viên tắt real-time protection có chủ đích; cập nhật nền tảng Defender
limitations:
  - 5001 và 5013 chưa có mẫu thật trên VM; cấu trúc EventData chưa xác minh (chỉ dùng windows_event_id)
  - exclude rỗng có chủ ý - danh sách khóa 5007 nội bộ cần loại trừ do Cyber quyết định
  - Chỉ phủ tamper của Defender, KHÔNG mở khóa DET-007 (tamper của DACN/Sysmon)
validation_status: synthetic_only
