# Kỳ vọng cho bộ đánh giá Atomic Red Team trên một Windows 10 VM (NGUỒN SỰ THẬT cho atomic_compare.py).
# Trạng thái: ĐỀ XUẤT của Claude, chờ người dùng/Cyber duyệt. Kỳ vọng suy ra từ rule YAML + cấu hình Sysmon của repo,
# CHƯA phải kết quả đo. Cột Defender không nằm ở đây: người vận hành ghi theo quan sát.
#
# category:
#   TP_EXPECTED      rule hiện có được kỳ vọng MATCH trên cây tiến trình của lần chạy
#   FN_NO_RULE       telemetry có (theo cấu hình Sysmon) nhưng chưa có rule phù hợp -> FN dự kiến
#   FN_NO_TELEMETRY  telemetry cần thiết không được thu (cấu hình Sysmon/nguồn chưa có) -> FN dự kiến
#   CONTROL          đối chứng lành tính, không rule nào được MATCH (MATCH = FP)
# Atomic YAML ghim theo commit dưới đây; chỉ cần YAML, không cần payload trong atomics/*/src hoặc bin.
