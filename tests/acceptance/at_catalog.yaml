  level: L
  goal: Nguồn giả -> segment sealed, manifest đúng hash
  pre: Thư mục home tạm; FakeSource phát N sự kiện XML synthetic
  steps: ["Chạy AgentRunner với FakeSource", "Đọc manifest của segment đã niêm phong", "Tính lại sha256"]
  expected: Segment .jsonl + .manifest.json, sha256 khớp, raw_xml được giữ nguyên
  tests: [tests/agent/test_bronze_writer.py::test_seal_writes_manifest_with_correct_hash, tests/agent/test_bronze_writer.py::test_raw_xml_preserved, tests/agent/test_runner.py::test_full_run_writes_all_and_health]
