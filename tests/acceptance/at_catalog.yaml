# Danh mục test nghiệm thu AT-01..AT-43 (PH11-T01).
# level: L = chạy được trên Linux với dữ liệu mẫu/giả lập; W = cần Windows VM thật (Claude không chạy);
#        D = kiểm tra tài liệu.
# tests: danh sách pytest node id (hoặc tiền tố) được coi là bằng chứng cho AT đó.
# gaps: phần của Expected mà các test hiện có KHÔNG phủ -> trạng thái tối đa là PARTIAL.
# Không có mục nào được điền PASS bằng tay: trạng thái do run_acceptance.py suy ra từ kết quả pytest.
# Tất cả dữ liệu là synthetic/fixture trừ khi ghi khác.
